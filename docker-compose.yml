version: "3.8"

services:
  # Main Web Service & API Gateway
  web:
    build: .
    container_name: pr-sentinel-web
    ports:
      - "8000:8000"
    environment:
      - PR_QA_HOST=0.0.0.0
      - PR_QA_PORT=8000
      - PR_QA_WORKER_CONCURRENCY=4
      - PR_QA_MAX_REPAIR_RETRIES=3
      - PR_QA_SANDBOX_MODE=subprocess
    volumes:
      - .:/app
    restart: unless-stopped

  # Scalable Async Worker Pool (Horizontally Scalable via docker-compose up --scale worker=4)
  worker:
    build: .
    command: python -m app.main
    environment:
      - PR_QA_WORKER_CONCURRENCY=8
      - PR_QA_SANDBOX_MODE=subprocess
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      - web
